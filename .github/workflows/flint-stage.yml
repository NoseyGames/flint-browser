name: Flint Windows build stage
on:
  workflow_call:
    inputs:
      resume:
        type: boolean
        required: true
      recover_webui:
        type: boolean
        default: false
    outputs:
      finished:
        value: ${{ jobs.compile.outputs.finished }}
permissions:
  actions: read
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ungoogled-software/ungoogled-chromium-windows
          ref: 76a692e3e39e1456e4691e7d9de28d32de1cdd87
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: ungoogled-chromium
          fetch-depth: ${{ inputs.recover_webui && '0' || '1' }}
          persist-credentials: false
      - name: Validate checkpoint provenance and permitted source changes
        if: inputs.recover_webui
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ungoogled-chromium/flint/windows/Resume-WebUiCheckpoint.ps1 -Mode Validate
      - name: Integrate native Flint assets with the Windows build
        shell: pwsh
        run: ./ungoogled-chromium/flint/windows/Build-Native.ps1 -PlatformDirectory $env:GITHUB_WORKSPACE
      - uses: ./.github/actions/prepare
      - name: Download the verified stage 5 source and object checkpoint
        if: inputs.recover_webui
        uses: actions/download-artifact@v8
        with:
          repository: NoseyGames/flint-browser
          run-id: '45565539172'
          artifact-ids: '15091017596'
          github-token: ${{ github.token }}
          path: C:\ungoogled-chromium-windows\build
          merge-multiple: true
          digest-mismatch: error
      - name: Restore the checkpoint and refresh Flint WebUI inputs
        if: inputs.recover_webui
        shell: pwsh
        run: ./ungoogled-chromium/flint/windows/Resume-WebUiCheckpoint.ps1 -Mode Restore
      - name: Compile or resume and package Windows x64
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: 'false'
          from_artifact: ${{ inputs.resume }}
