name: Compile Flint Windows x64
on:
  workflow_dispatch:
  push:
    branches: [codex/flint-native]
permissions:
  contents: read
concurrency:
  group: flint-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stage-1:
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: false
  stage-2:
    needs: stage-1
    if: needs.stage-1.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-3:
    needs: stage-2
    if: needs.stage-2.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-4:
    needs: stage-3
    if: needs.stage-3.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-5:
    needs: stage-4
    if: needs.stage-4.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-6:
    needs: stage-5
    if: needs.stage-5.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-7:
    needs: stage-6
    if: needs.stage-6.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-8:
    needs: stage-7
    if: needs.stage-7.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-9:
    needs: stage-8
    if: needs.stage-8.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-10:
    needs: stage-9
    if: needs.stage-9.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-11:
    needs: stage-10
    if: needs.stage-10.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-12:
    needs: stage-11
    if: needs.stage-11.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-13:
    needs: stage-12
    if: needs.stage-12.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-14:
    needs: stage-13
    if: needs.stage-13.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-15:
    needs: stage-14
    if: needs.stage-14.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  stage-16:
    needs: stage-15
    if: needs.stage-15.outputs.finished == 'false'
    uses: ./.github/workflows/flint-stage.yml
    with:
      resume: true
  verify-package:
    needs: [stage-1, stage-2, stage-3, stage-4, stage-5, stage-6, stage-7, stage-8, stage-9, stage-10, stage-11, stage-12, stage-13, stage-14, stage-15, stage-16]
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: chromium
          path: package
      - name: Check the packaged native browser and new tab
        shell: pwsh
        run: |
          ./flint/windows/Verify-Native.ps1 -PackageDirectory package -OutputDirectory verified
      - uses: actions/upload-artifact@v7
        with:
          name: Flint-Windows-x64
          path: verified/*
          if-no-files-found: error
          compression-level: 0
